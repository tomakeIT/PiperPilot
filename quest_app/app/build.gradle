plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pipertools.questteleop'
    compileSdk 32
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId 'com.pipertools.questteleop'
        minSdk 29
        targetSdk 32
        versionCode 1
        versionName '0.1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    buildFeatures {
        prefab true
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    // Khronos OpenXR loader (works on Quest: discovers the system runtime broker).
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.0.34'
}
