<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">PiperPilot</title>
  <desc id="desc">Quest and SpaceMouse controllers streaming low-latency motion to a Piper-X robot arm</desc>
  <defs>
