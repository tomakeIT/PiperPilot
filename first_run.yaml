# Conservative overlay for cautious sessions (first runs, new tasks, guests).
# Contains ONLY the keys it overrides — everything else comes from
# piper_teleop/configs/default.yaml, which make collect uses on its own.
#
# Opt in per run:
#   make collect CONFIG=first_run.yaml TASK="..."
#   piper-collect --config first_run.yaml --task "..."

arm:
  speed_percent: 50      # firmware-side global speed governor (default 100)

teleop:
  pos_scale: 0.6         # hand motion damped to 60% (default 1.0)
  limits:
    max_lin_vel: 0.4     # m/s   (default 0.8)
    max_ang_vel: 1.5     # rad/s (default 2.5)

spacemouse:
  max_lin_vel: 0.08      # m/s at full deflection  (default 0.15)
  max_ang_vel: 0.5       # rad/s at full deflection (default 0.9)
